            \r\n消息上下文:{{#1750337155264.context#}}\n待验证活动集合：{{#1776243391792.result#}}\r\
            \r\n10次抽取结果及依据:{{#1776261232578.output#}}\r\r\n抽取示例:{{#1776238014105.result#}}\r\
            \r\n活动及触发词:{{#1750337155264.activity_triggers#}}\r"

    - data:
        code: "def main(arg1: str, arg2: str, arg3: str):\n    # =========================\n\
          \    # 1. 解析预定义标签集合\n    # =========================\n    ALL_LABELS = [x.strip()\
          \ for x in arg3.split(\",\") if x.strip()]\n\n    # =========================\n\
          \    # 2. 初始化所有标签为0\n    # =========================\n    label_map = {label:\
          \ 0 for label in ALL_LABELS}\n\n    # =========================\n    # 3.\
          \ 解析输入（兼容“无”、空字符串、两种格式）\n    # =========================\n    def parse_input(data:\
          \ str):\n        # ✅ 处理 None / \"\" / \"无\"\n        if not data or data.strip()\
          \ == \"无\":\n            return []\n\n        results = []\n\n        for\
          \ line in data.split(\"\\n\"):\n            line = line.strip()\n\n    \
          \        # 跳过空行和“无”\n            if not line or line == \"无\":\n       \
          \         continue\n\n            # 情况1：Delivery:1\n            if \":\"\
          \ in line:\n                key, value = line.split(\":\", 1)\n        \
          \        key = key.strip()\n                value = value.strip()\n\n  \
          \              # 只要 value == 1\n                if value == \"1\":\n   \
          \                 results.append(key)\n\n            # 情况2：只有标签名\n     \
          \       else:\n                results.append(line)\n\n        return results\n\
          \n    # =========================\n    # 4. 合并 arg1 + arg2\n    # =========================\n\
          \    labels = set(parse_input(arg1) + parse_input(arg2))\n\n    # =========================\n\
          \    # 5. 填充0/1（只认合法标签）\n    # =========================\n    for label\
          \ in labels:\n        if label in label_map:\n            label_map[label]\
          \ = 1\n\n    # =========================\n    # 6. 输出格式化字符串\n    # =========================\n\
          \    result = \"\\n\".join(\n        f\"{label}:{label_map[label]}\"\n \
          \       for label in ALL_LABELS\n    )\n\n    return {\n        \"result\"\
          : result\n    }"
        code_language: python3
        outputs:
          result:
            children: null
            type: string

    - data:
        code: "from datetime import datetime, timedelta\nimport re\n\ndef main(msg_time:\
          \ str, coarse_offset: str) -> dict:\n    dt = datetime.fromisoformat(msg_time)\n\
          \    \n    # 处理 None、\"无\"、\"none\" 的情况，统一设置为 \"0\"\n    if coarse_offset\
          \ is None or (isinstance(coarse_offset, str) and coarse_offset.strip().lower()\
          \ in (\"无\", \"none\")):\n        coarse_offset = \"0\"\n    \n    # 处理纯\
          \ \"0\" 的情况\n    if coarse_offset.strip() in (\"0\", \"+0\", \"-0\"):\n\
          \        return {\"result\": dt.strftime(\"%Y-%m-%dT%H:%M:%S\")}\n    \n\
          \    match = re.fullmatch(r'([+-]?\\d+)([dhms])', coarse_offset.strip())\n\
          \    if not match:\n        raise ValueError(f\"无效的偏移量格式: {coarse_offset}，支持格式如：1d、-2h、+30m、10s\"\
          )\n    \n    value = int(match.group(1))\n    unit = match.group(2)\n  \
          \  \n    unit_map = {\n        'd': timedelta(days=value),\n        'h':\
          \ timedelta(hours=value),\n        'm': timedelta(minutes=value),\n    \
          \    's': timedelta(seconds=value),\n    }\n    \n    result_dt = dt + unit_map[unit]\n\
          \    \n    return {\n        \"result\": result_dt.strftime(\"%Y-%m-%dT%H:%M:%S\"\
          )\n    }"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
